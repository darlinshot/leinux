[window]
opacity = 0.8

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font Propo"
style = "SemiBold"

[colors.primary]
background = '{{colors.background.default.hex}}'
foreground = '{{colors.on_background.default.hex}}'

[colors.cursor]
text = '{{colors.on_primary.default.hex}}'
cursor = '{{colors.primary.default.hex}}'

[colors.vi_mode_cursor]
text = '{{colors.on_secondary.default.hex}}'
cursor = '{{colors.secondary.default.hex}}'

[colors.search.matches]
foreground = '{{colors.on_tertiary.default.hex}}'
background = '{{colors.tertiary.default.hex}}'

[colors.search.focused_match]
foreground = '{{colors.on_primary.default.hex}}'
background = '{{colors.primary.default.hex}}'

[colors.footer_bar]
foreground = '{{colors.inverse_on_surface.default.hex}}'
background = '{{colors.inverse_surface.default.hex}}'

[colors.hints.start]
foreground = '{{colors.on_secondary.default.hex}}'
background = '{{colors.secondary.default.hex}}'

[colors.hints.end]
foreground = '{{colors.on_secondary.default.hex}}'
background = '{{colors.secondary.default.hex}}'

[colors.selection]
text = '{{colors.on_primary_container.default.hex}}'
background = '{{colors.primary_container.default.hex}}'

[colors.normal]
black = '{{colors.surface_container_highest.default.hex}}'
red = '{{colors.error.default.hex}}'
green = '{{colors.tertiary.default.hex}}'
yellow = '{{colors.primary.default.hex}}'
blue = '{{colors.secondary.default.hex}}'
magenta = '{{colors.on_surface_variant.default.hex}}'
cyan = '{{colors.outline.default.hex}}'
white = '{{colors.on_surface.default.hex}}'

[colors.bright]
black = '{{colors.outline.default.hex}}'
red = '{{colors.on_error_container.default.hex}}'
green = '{{colors.tertiary_fixed.default.hex}}'
yellow = '{{colors.primary_fixed.default.hex}}'
blue = '{{colors.secondary_fixed.default.hex}}'
magenta = '{{colors.on_secondary_container.default.hex}}'
cyan = '{{colors.on_tertiary_container.default.hex}}'
white = '{{colors.inverse_surface.default.hex}}'
